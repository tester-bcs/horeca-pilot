[package]
name = "luck-pilot"
version = "0.1.0"
edition = "2021"
description = "Форк ai-agent-порта Luck (компилятор+планировщик) — рабочий прототип пайпа бизнес-инкубатора. Нативные проекты не трогает."

[dependencies]
luck-engine = { package = "luck", path = "vendor/luck-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
ureq = { version = "2", features = ["json"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
